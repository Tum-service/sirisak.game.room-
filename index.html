<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎃 คลังคำศัพท์อังกฤษ · ฮาโลวีนสเปเชียล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Itim&family=Creepster&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Kanit','Itim','Segoe UI',sans-serif;font-weight:500;background:#0a0612;min-height:100vh;padding:16px;color:#f5e6d3;position:relative;overflow-x:hidden}
.bg-animated{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(circle at 82% 12%, rgba(255,200,120,.18) 0%, transparent 22%),
  radial-gradient(circle at 50% 55%, rgba(107,33,168,.30), transparent 65%),
  radial-gradient(circle at 15% 85%, rgba(249,115,22,.20), transparent 55%),
  linear-gradient(180deg,#0a0612 0%,#1a0b2e 45%,#2d1b4e 100%);
  background-size:200% 200%;animation:gradientFlow 22s ease infinite}
@keyframes gradientFlow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.moon{position:fixed;top:6%;right:10%;width:110px;height:110px;border-radius:50%;z-index:-2;
  background:radial-gradient(circle at 35% 32%,#fffbe6 0%,#f5e6a0 55%,#d4b95e 100%);
  box-shadow:0 0 70px 25px rgba(255,230,150,.40),0 0 140px 60px rgba(255,200,100,.22),0 0 200px 100px rgba(168,85,247,.15);
  animation:moonGlow 6s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 70px 25px rgba(255,230,150,.40),0 0 140px 60px rgba(255,200,100,.22),0 0 200px 100px rgba(168,85,247,.15)}
  50%{box-shadow:0 0 90px 35px rgba(255,230,150,.55),0 0 170px 80px rgba(255,200,100,.30),0 0 240px 120px rgba(168,85,247,.22)}}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(180,150,80,.30)}
.moon::before{width:26px;height:26px;top:24%;left:22%}
.moon::after{width:16px;height:16px;bottom:28%;right:24%}
.fog{position:fixed;left:0;right:0;bottom:0;height:45%;z-index:-2;pointer-events:none;
  background:linear-gradient(180deg,transparent 0%,rgba(150,100,200,.12) 40%,rgba(100,60,150,.28) 100%);
  filter:blur(24px);animation:fogMove 26s ease-in-out infinite alternate}
@keyframes fogMove{0%{transform:translateX(-6%);opacity:.65}100%{transform:translateX(6%);opacity:1}}
.fog.fog2{bottom:5%;height:35%;animation-duration:38s;animation-direction:alternate-reverse;opacity:.7;
  background:linear-gradient(180deg,transparent 0%,rgba(249,115,22,.10) 50%,rgba(107,33,168,.22) 100%)}
.bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-blobs .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;will-change:transform}
.bg-blobs .blob:nth-child(1){width:340px;height:340px;background:#a855f7;top:-90px;left:-70px;animation:blobFloat1 15s ease-in-out infinite}
.bg-blobs .blob:nth-child(2){width:280px;height:280px;background:#f97316;top:42%;right:-90px;animation:blobFloat2 20s ease-in-out infinite}
.bg-blobs .blob:nth-child(3){width:320px;height:320px;background:#7c3aed;bottom:-110px;left:18%;animation:blobFloat3 17s ease-in-out infinite}
.bg-blobs .blob:nth-child(4){width:240px;height:240px;background:#ea580c;top:12%;right:18%;animation:blobFloat1 22s ease-in-out infinite reverse}
.bg-blobs .blob:nth-child(5){width:280px;height:280px;background:#6b21a8;bottom:8%;right:8%;animation:blobFloat2 18s ease-in-out infinite reverse}
@keyframes blobFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,80px) scale(1.15)}}
@keyframes blobFloat2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.1)}}
@keyframes blobFloat3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-60px) scale(1.2)}}
.bats{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bats .bat{position:absolute;width:44px;height:24px;color:#1a0b2e;
  filter:drop-shadow(0 0 8px rgba(168,85,247,.65)) drop-shadow(0 2px 4px rgba(0,0,0,.9));
  animation:batFly linear infinite}
.bats .bat svg{width:100%;height:100%;display:block}
.bats .bat .bat-wing{transform-origin:50% 50%;animation:wingFlap .32s ease-in-out infinite}
@keyframes wingFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
@keyframes batFly{
  0%{transform:translate(0,0) rotate(-4deg) scale(1);opacity:.9}
  25%{transform:translate(-32vw,-7vh) rotate(6deg) scale(1.05);opacity:1}
  50%{transform:translate(-64vw,5vh) rotate(-3deg) scale(.95);opacity:.85}
  75%{transform:translate(-30vw,-3vh) rotate(5deg) scale(1.02);opacity:1}
  100%{transform:translate(0,0) rotate(-4deg) scale(1);opacity:.9}}
.spider-web{position:fixed;top:0;left:0;width:180px;height:180px;z-index:0;pointer-events:none;opacity:.55;
  background:
    radial-gradient(circle at 0% 0%, transparent 55%, rgba(200,200,220,.14) 56%, transparent 58%),
    radial-gradient(circle at 0% 0%, transparent 35%, rgba(200,200,220,.14) 36%, transparent 38%),
    radial-gradient(circle at 0% 0%, transparent 18%, rgba(200,200,220,.14) 19%, transparent 21%);
  background-size:180px 180px;animation:webPulse 5s ease-in-out infinite}
.spider-web::before,.spider-web::after{content:"";position:absolute;top:0;left:0;height:180px;width:2px;
  background:linear-gradient(180deg,rgba(200,200,220,.20),transparent);transform-origin:top left}
.spider-web::before{transform:rotate(30deg)}
.spider-web::after{transform:rotate(60deg)}
@keyframes webPulse{0%,100%{opacity:.5}50%{opacity:.75}}
.spider{position:fixed;top:14px;left:14px;width:26px;height:26px;z-index:1;pointer-events:none;
  animation:spiderBob 3.2s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
@keyframes spiderBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(8px) rotate(3deg)}}
.bg-floaters{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-floaters span{position:absolute;bottom:-60px;font-size:22px;opacity:0;
  animation-name:floatUp;animation-timing-function:ease-in;animation-iteration-count:infinite;
  filter:drop-shadow(0 0 6px rgba(168,85,247,.5))}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.55}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.fs-toggle{position:fixed;top:14px;left:14px;z-index:9999;
  width:42px;height:42px;border-radius:50%;
  background:rgba(20,10,40,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(249,115,22,.55);color:#fb923c;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 0 rgba(249,115,22,.4);
  -webkit-tap-highlight-color:transparent}
.fs-toggle:hover{background:rgba(249,115,22,.28);color:#ffedd5;transform:scale(1.08);
  box-shadow:0 6px 20px rgba(249,115,22,.5),0 0 0 4px rgba(249,115,22,.15)}
.fs-toggle:active{transform:scale(.94)}
.fs-toggle svg{width:20px;height:20px;transition:transform .3s}
.fs-toggle .fs-icon-contract{display:none}
.fs-toggle.is-fullscreen .fs-icon-expand{display:none}
.fs-toggle.is-fullscreen .fs-icon-contract{display:block}
.fs-toggle.is-fullscreen{border-color:rgba(168,85,247,.65);color:#c4b5fd}
.fs-toggle.is-fullscreen:hover{background:rgba(168,85,247,.3);color:#e9d5ff}
.app{max-width:1200px;margin:0 auto;position:relative;z-index:1;padding-left:0}
.header{text-align:center;padding:30px 24px 34px;position:relative;margin-bottom:28px;
  background:
    radial-gradient(ellipse at 30% 15%, rgba(255,200,120,.35), transparent 45%),
    linear-gradient(135deg,#c2410c 0%,#ea580c 30%,#f97316 55%,#fb923c 100%);
  background-size:200% 200%;animation:headerGlow 12s ease infinite;
  border-radius:50% 50% 42% 42% / 22% 22% 14% 14%;
  box-shadow:0 16px 40px rgba(234,88,12,.55),
             0 0 0 3px rgba(34,197,94,.35) inset,
             0 0 60px 10px rgba(249,115,22,.35),
             inset 0 -10px 30px rgba(0,0,0,.35),
             inset 0 10px 30px rgba(255,200,120,.20);
  color:#fff8e7;overflow:visible}
@keyframes headerGlow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.header::before{content:"";position:absolute;top:-28px;left:50%;transform:translateX(-50%);
  width:44px;height:34px;background:linear-gradient(180deg,#22c55e,#15803d);
  border-radius:10px 14px 6px 6px;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.3);
  transform-origin:bottom center;animation:stemSway 3.5s ease-in-out infinite}
@keyframes stemSway{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg)}}
.header::after{content:"🎃";position:absolute;right:14px;bottom:-14px;font-size:44px;opacity:.55;transform:rotate(12deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.header .pumpkin-deco-left{content:"👻";position:absolute;left:16px;bottom:-10px;font-size:38px;opacity:.65;transform:rotate(-10deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:ghostFloat 4s ease-in-out infinite}
@keyframes ghostFloat{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(-10deg) translateY(-8px)}}
.header-inner{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;gap:22px;flex-wrap:wrap}
.header-text{text-align:center}
.header h1{font-family:'Creepster','Kanit',cursive;font-size:52px;font-weight:800;letter-spacing:2px;
  text-shadow:0 0 10px rgba(255,235,150,.9),0 0 22px rgba(249,115,22,.8),0 4px 0 rgba(0,0,0,.35);
  color:#ffedd5}
.header p{font-size:21px;font-weight:600;color:#fff8e7;margin-top:4px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.header p.school-line{font-size:19px;font-weight:700;color:#fde68a;margin-top:2px}
.header .badge{display:inline-block;background:rgba(10,6,18,.55);backdrop-filter:blur(8px);
  padding:9px 22px;border-radius:50px;font-size:15px;margin-top:14px;font-weight:700;color:#ffedd5;
  border:1.5px solid rgba(255,200,120,.45);box-shadow:0 0 20px rgba(249,115,22,.35)}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px;align-items:center;
  background:rgba(20,10,40,.70);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:16px 20px;border-radius:30px;
  box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 0 1.5px rgba(168,85,247,.30) inset,0 0 30px rgba(107,33,168,.35);
  border:1px solid rgba(168,85,247,.35)}
.controls select{padding:10px 18px;border:2px solid #f97316;border-radius:30px;font-size:16px;
  background:rgba(10,6,18,.85);font-family:inherit;color:#ffedd5;outline:none;cursor:pointer;min-width:140px;
  box-shadow:0 0 14px rgba(249,115,22,.35) inset}
.controls select option{background:#1a0b2e;color:#ffedd5}
.controls .search-wrap{flex:1;min-width:180px;position:relative}
.controls .search-wrap input{width:100%;padding:10px 16px 10px 44px;
  border:2px solid rgba(168,85,247,.4);border-radius:30px;font-size:16px;
  background:rgba(10,6,18,.85);color:#f5e6d3;outline:none;font-family:inherit;transition:.2s}
.controls .search-wrap input::placeholder{color:#a78bfa;opacity:.7}
.controls .search-wrap input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.25),0 0 20px rgba(249,115,22,.4)}
.controls .search-wrap .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#f97316}
.controls .stats{font-size:16px;color:#c4b5fd;margin-left:auto;white-space:nowrap;
  background:rgba(107,33,168,.40);padding:6px 16px;border-radius:30px;border:1px solid rgba(168,85,247,.35)}
.controls .stats strong{color:#fb923c;font-size:20px;text-shadow:0 0 10px rgba(251,146,60,.7)}
.grade-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;justify-content:center}
.grade-tabs button{padding:9px 20px;border:2px solid rgba(168,85,247,.40);border-radius:40px;
  background:rgba(20,10,40,.65);font-size:15px;font-weight:700;color:#c4b5fd;cursor:pointer;
  transition:.2s;font-family:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.grade-tabs button:hover{transform:translateY(-2px);border-color:#f97316;color:#ffedd5;box-shadow:0 6px 16px rgba(249,115,22,.35)}
.grade-tabs button.active{background:radial-gradient(ellipse at 30% 25%,#fb923c,#f97316 45%,#ea580c 100%);
  color:#0a0612;border-color:#fb923c;font-weight:800;
  box-shadow:0 6px 20px rgba(249,115,22,.6),inset 0 -3px 0 rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.25)}
.grade-tabs a.game-btn{padding:9px 20px;border:2px solid rgba(34,197,94,.55);border-radius:40px;
  background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(21,128,61,.4));
  font-size:15px;font-weight:800;color:#bbf7d0;cursor:pointer;
  transition:.2s;font-family:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 0 14px rgba(34,197,94,.35),inset 0 0 0 1px rgba(187,247,208,.15)}
.grade-tabs a.game-btn:hover{transform:translateY(-2px);border-color:#4ade80;color:#f0fdf4;
  background:linear-gradient(135deg,#22c55e,#15803d);
  box-shadow:0 6px 22px rgba(34,197,94,.65),0 0 30px rgba(34,197,94,.4)}
.grade-tabs a.game-btn:active{transform:scale(.96)}
.grade-tabs a.game-btn .game-pulse{display:inline-block;animation:gamePulse 1.6s ease-in-out infinite}
@keyframes gamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:linear-gradient(180deg,rgba(30,15,55,.9),rgba(15,7,30,.95));
  border-radius:28px;padding:16px 16px 14px;
  box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(168,85,247,.25),0 0 0 1.5px rgba(168,85,247,.20);
  cursor:pointer;border:2px solid transparent;position:relative;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  transition:.25s;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:28px;
  background:radial-gradient(circle at 50% -10%,rgba(249,115,22,.15),transparent 55%);pointer-events:none}
.card:hover{transform:translateY(-6px);border-color:#f97316;
  box-shadow:0 18px 40px rgba(249,115,22,.35),0 0 30px rgba(107,33,168,.5),inset 0 1px 0 rgba(251,146,60,.4)}
.card:active{transform:scale(.96)}
.card .img-frame{position:relative;width:100%;aspect-ratio:1/1;padding:4px;border-radius:22px;overflow:hidden;
  margin-bottom:10px;background:linear-gradient(135deg,#2d1b4e,#4c1d95,#7c2d12);
  display:flex;align-items:center;justify-content:center}
.card .img-frame::before{content:"";position:absolute;top:50%;left:50%;width:220%;height:220%;
  background:conic-gradient(from 0deg,#f97316,#ea580c,#a855f7,#6b21a8,#fbbf24,#f97316);
  animation:spinBorder 5s linear infinite;transform:translate(-50%,-50%) rotate(0);opacity:.85}
@keyframes spinBorder{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card .card-emoji{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:radial-gradient(circle at 50% 40%,#2a1240,#0f0518);
  font-size:62px;line-height:1;user-select:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.card .card-svg{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:radial-gradient(circle at 50% 40%,#2a1240,#0f0518);padding:12%;box-sizing:border-box}
.card .card-svg svg{width:100%;height:100%;display:block}
.card .card-letter{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:radial-gradient(circle at 50% 40%,#2a1240,#0f0518);
  font-size:74px;font-weight:900;line-height:1;color:#fb923c;user-select:none;
  text-shadow:0 0 20px rgba(249,115,22,.8),0 4px 0 rgba(0,0,0,.4)}
.card .pixabay-img{position:relative;z-index:1;width:100%;height:100%;
  object-fit:cover;border-radius:18px;display:none;
  background:radial-gradient(circle at 50% 40%,#2a1240,#0f0518)}
.card .pixabay-img.loaded{display:block}
.card .img-frame .card-emoji.hidden,
.card .img-frame .card-svg.hidden,
.card .img-frame .card-letter.hidden{display:none}
.card .img-frame.loading::after{content:"";position:absolute;inset:4px;border-radius:18px;
  background:linear-gradient(90deg,rgba(168,85,247,.1),rgba(249,115,22,.2),rgba(168,85,247,.1));
  background-size:200% 100%;animation:shimmer 1.2s linear infinite;z-index:0}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.card .en{font-size:27px;font-weight:800;color:#ffedd5;line-height:1.3;
  text-shadow:0 0 12px rgba(255,200,120,.4),0 2px 4px rgba(0,0,0,.6)}
.card .th{font-size:17px;font-weight:600;color:#c4b5fd;margin-top:2px}
.card .pos{font-size:12px;font-weight:700;color:#a78bfa;background:rgba(107,33,168,.35);
  padding:2px 14px;border-radius:30px;margin-top:6px;display:inline-block;border:1px solid rgba(168,85,247,.4)}
.card .syn{font-size:12px;font-weight:600;color:#86efac;
  background:rgba(34,197,94,.15);padding:3px 10px;border-radius:30px;margin-top:6px;
  display:inline-block;border:1px solid rgba(34,197,94,.35);max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .syn::before{content:"≈ "}
.card .speak-icon{position:absolute;top:12px;right:14px;font-size:18px;opacity:.4;transition:.2s;z-index:2;filter:drop-shadow(0 0 4px rgba(249,115,22,.6))}
.card:hover .speak-icon{opacity:1}
.card.speaking{border-color:#f97316;background:linear-gradient(180deg,rgba(50,25,80,.95),rgba(30,15,55,.98));
  box-shadow:0 0 30px rgba(249,115,22,.6),0 10px 26px rgba(0,0,0,.55)}
.card.speaking .speak-icon{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.card .mic-icon{position:absolute;top:12px;left:14px;font-size:17px;z-index:2;
  background:rgba(20,10,40,.9);border-radius:50%;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;opacity:.65;
  box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 1px rgba(168,85,247,.35);transition:.2s;cursor:pointer}
.card:hover .mic-icon{opacity:1}
.card .mic-icon:active{transform:scale(.9)}
.card.mic-listening .mic-icon{opacity:1;background:rgba(249,115,22,.35);animation:micPulse .9s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.6)}50%{box-shadow:0 0 0 8px rgba(249,115,22,0)}}
.card.mic-success{animation:cardGoodFlash 1s ease}
.card.mic-fail{animation:cardShake .45s ease}
@keyframes cardGoodFlash{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}60%{box-shadow:0 0 0 14px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sticker-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
.sticker-pop{text-align:center;animation:stickerPop 1.7s ease forwards;filter:drop-shadow(0 6px 12px rgba(249,115,22,.6))}
.sticker-pop .sticker-emoji{font-size:58px;display:block}
.sticker-pop .sticker-text{display:inline-block;margin-top:2px;font-size:16px;font-weight:800;color:#ffedd5;
  background:linear-gradient(135deg,#f97316,#ea580c);padding:3px 14px;border-radius:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.5);border:1px solid rgba(255,200,120,.5)}
.sticker-pop.big .sticker-emoji{font-size:92px}
.sticker-pop.big .sticker-text{font-size:20px;padding:5px 20px}
@keyframes stickerPop{0%{transform:scale(0) rotate(-20deg);opacity:0}15%{transform:scale(1.35) rotate(10deg);opacity:1}30%{transform:scale(.92) rotate(-6deg)}45%{transform:scale(1.08) rotate(3deg)}60%{transform:scale(1) rotate(0)}82%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-14px)}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,2,15,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}

const PIXABAY_CACHE_KEY = 'pixabay_img_cache_v2';
let pixabayCache = {};
try { pixabayCache = JSON.parse(localStorage.getItem(PIXABAY_CACHE_KEY) || '{}'); }
catch(e) { pixabayCache = {}; }

function savePixabayCache() {
  try { localStorage.setItem(PIXABAY_CACHE_KEY, JSON.stringify(pixabayCache)); }
  catch(e) {}
}

async function fetchPixabayImage(word) {
  const key = word.toLowerCase().trim();
  if (pixabayCache[key] !== undefined) return pixabayCache[key];
  try {
    const q = encodeURIComponent(key);
    const url = `https://pixabay.com/api/?key=${PIXABAY_KEY}&q=${q}&image_type=photo&per_page=3&safesearch=true&orientation=horizontal`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let imgUrl = null;
    if (data.hits && data.hits.length > 0) {
      imgUrl = data.hits[0].webformatURL || data.hits[0].previewURL || null;
    }
    pixabayCache[key] = imgUrl;
    savePixabayCache();
    return imgUrl;
  } catch (err) {
    console.warn('Pixabay fetch error for', word, err);
    return null;
  }
}

async function loadPixabayImagesForCards() {
  const cards = document.querySelectorAll('.card');
  const CONCURRENCY = 4;
  const queue = Array.from(cards);
  async function worker() {
    while (queue.length) {
      const card = queue.shift();
      if (!card) break;
      const word = card.dataset.en;
      const imgEl = card.querySelector('.pixabay-img');
      const frame = card.querySelector('.img-frame');
      if (!imgEl || !frame) continue;
      const url = await fetchPixabayImage(word);
      if (url) {
        const img = new Image();
        img.onload = () => {
          imgEl.src = url;
          imgEl.classList.add('loaded');
          frame.querySelectorAll('.card-emoji,.card-svg,.card-letter')
            .forEach(el => el.classList.add('hidden'));
          frame.classList.remove('loading');
        };
        img.onerror = () => { frame.classList.remove('loading'); };
        img.src = url;
      } else {
        frame.classList.remove('loading');
      }
    }
  }
  await Promise.all(Array.from({length: CONCURRENCY}, worker));
}

async function loadPixabayImageForModal(word, container) {
  const imgEl = container.querySelector('.modal-pixabay-img');
  const url = await fetchPixabayImage(word);
  if (url && imgEl) {
    const img = new Image();
    img.onload = () => {
      imgEl.src = url;
      imgEl.style.display = 'block';
      container.querySelectorAll('.modal-emoji,.modal-svg,.modal-letter')
        .forEach(el => el.style.display = 'none');
    };
    img.src = url;
  }
}

function getImage(word, big) {
  const w = (word || '').toLowerCase().trim();
  if (!w) return `<span class="${big ? 'modal' : 'card'}-letter">?</span>`;
  const sizeClass = big ? 'modal' : 'card';
  if (EMOJI_MAP[w]) return `<span class="${sizeClass}-emoji">${EMOJI_MAP[w]}</span>`;
  const first = w.split(/\s+/)[0];
  if (EMOJI_MAP[first]) return `<span class="${sizeClass}-emoji">${EMOJI_MAP[first]}</span>`;
  if (SVG_MAP[w]) return `<div class="${sizeClass}-svg">${SVG_MAP[w]}</div>`;
  if (SVG_MAP[first]) return `<div class="${sizeClass}-svg">${SVG_MAP[first]}</div>`;
  const letter = w.charAt(0).toUpperCase();
  const colors = ['#f97316','#ef4444','#a855f7','#06b6d4','#10b981','#eab308','#ec4899'];
  const color = colors[letter.charCodeAt(0) % colors.length];
  return `<span class="${sizeClass}-letter" style="color:${color}">${letter}</span>`;
}

function parseVocabData(raw) {
  const lines = raw.split('\n');
  const entries = [];
  let currentGrade = 'ทั้งหมด';
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('## 📘') || line.startsWith('## 📗') ||
        line.startsWith('## 📙') || line.startsWith('## 📕') ||
        line.startsWith('## 📔') || line.startsWith('## 📓')) {
      const match = line.match(/ป\.\s*(\d+)/);
      if (match) currentGrade = `ป.${match[1]}`;
      continue;
    }
    if (line.startsWith('## 🎨') || line.startsWith('## 🔷') ||
        line.startsWith('## 📅') || line.startsWith('## 📆') ||
        line.startsWith('## 🔢') || line.startsWith('## 🏅')) {
      currentGrade = 'พิเศษ';
      continue;
    }
    const entryMatch = line.match(/^(\d+)\.\s+([^\–]+)\s*–\s*(.+)$/);
    if (entryMatch) {
      const word = entryMatch[2].trim();
      const enSentence = entryMatch[3].trim();
      let thSentence = '';
      let thMeaning = '';
      if (i + 1 < lines.length) {
        const nextLine = lines[i + 1].trim();
        const thMatch = nextLine.match(/^\*\*\s*(.+?)\s*–\s*(.+?)\s*\*\*$/) || nextLine.match(/^\*\*\s*(.+?)\s*–\s*(.+)$/);
        if (thMatch) {
          thMeaning = thMatch[1].trim();
          thSentence = thMatch[2].replace(/\*+$/, '').trim();
          i++;
        }
      }
      let pos = '';
      const posMatch = word.match(/\(([^)]+)\)/);
      if (posMatch) pos = posMatch[1].trim();
      const cleanWord = word.replace(/\([^)]*\)/g, '').trim() || word;
      entries.push({
        en: cleanWord,
        th: thMeaning || cleanWord,
        pos: pos,
        grade: currentGrade,
        sentenceEn: enSentence,
        sentenceTh: thSentence || thMeaning || cleanWord,
      });
    }
  }
  return entries;
}

let bestVoice = null;
function loadBestEnglishVoice() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const preferred = ['Google US English','Microsoft David','Alex','Samantha','en-US','en-GB'];
  for (const name of preferred) {
    const found = voices.find(v => v.name.includes(name) || v.lang.startsWith(name));
    if (found) { bestVoice = found; return; }
  }
  const anyEn = voices.find(v => v.lang.startsWith('en'));
  if (anyEn) bestVoice = anyEn;
}
if (window.speechSynthesis) {
  if (window.speechSynthesis.getVoices().length) loadBestEnglishVoice();
  else window.speechSynthesis.onvoiceschanged = loadBestEnglishVoice;
}
function speakEnglish(text) {
  if (!window.speechSynthesis) { alert('เบราว์เซอร์ไม่รองรับการสังเคราะห์เสียง'); return; }
  window.speechSynthesis.cancel();
  if (!bestVoice) loadBestEnglishVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.8;
  u.pitch = 1.0;
  if (bestVoice) u.voice = bestVoice;
  if (!u.voice) {
    const voices = window.speechSynthesis.getVoices();
    const fb = voices.find(v => v.lang.startsWith('en'));
    if (fb) u.voice = fb;
  }
  window.speechSynthesis.speak(u);
}

//  PRONUNCIATION PRACTICE
// ============================================================
const SpeechRecCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let activeRecognition = null;
let isPracticing = false;
function normalizeWord(s) { return (s || '').toLowerCase().replace(/[^a-z]/g, ''); }
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const temp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = temp;
    }
  }
  return dp[n];
}
function similarity(a, b) {
  const longer = Math.max(a.length, b.length) || 1;
  return 1 - levenshtein(a, b) / longer;
}
function isGoodMatch(target, transcripts) {
  const t = normalizeWord(target);
  if (!t) return false;
  for (const alt of transcripts) {
    const s = normalizeWord(alt);
    if (!s) continue;
    if (s === t) return true;
    if (s.includes(t) || t.includes(s)) return true;
    if (similarity(t, s) >= 0.72) return true;
  }
  return false;
}
function practicePronunciation(word, callbacks) {
  callbacks = callbacks || {};
  if (isPracticing) return;
  if (!SpeechRecCtor) { callbacks.onError && callbacks.onError('unsupported'); return; }
  let settled = false;
  isPracticing = true;
  const rec = new SpeechRecCtor();
  activeRecognition = rec;
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 5;
  rec.continuous = false;
  rec.onstart = () => { callbacks.onListening && callbacks.onListening(); };
  rec.onresult = (e) => {
    settled = true;
    const alts = [];
    const results = e.results && e.results[0];
    if (results) for (let i = 0; i < results.length; i++) alts.push(results[i].transcript);
    const good = isGoodMatch(word, alts);
    callbacks.onResult && callbacks.onResult(good, alts[0] || '');
  };
  rec.onerror = (e) => { settled = true; callbacks.onError && callbacks.onError(e.error || 'unknown'); };
  rec.onend = () => {
    isPracticing = false;
    activeRecognition = null;
    if (!settled) callbacks.onError && callbacks.onError('no-speech');
    callbacks.onEnd && callbacks.onEnd();
  };
  try { rec.start(); }
  catch (err) { isPracticing = false; activeRecognition = null; callbacks.onError && callbacks.onError('start-failed'); }
}
function showStickerOverlay(container, big) {
  if (!container) return;
  const overlay = document.createElement('div');
  overlay.className = 'sticker-overlay';
  overlay.innerHTML = `<div class="sticker-pop${big ? ' big' : ''}"><span class="sticker-emoji">🎃</span><span class="sticker-text">ถูกใจ!</span></div>`;
  container.appendChild(overlay);
  setTimeout(() => overlay.remove(), 1700);
}
function startPracticeOnCard(card, micIcon, word) {
  if (isPracticing) return;
  if (!SpeechRecCtor) { alert('ขออภัยครับ เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียงพูด ลองเปิดด้วย Chrome ดูนะครับ'); return; }
  card.classList.add('mic-listening');
  practicePronunciation(word, {
    onListening() {},
    onResult(good) {
      card.classList.remove('mic-listening');
      if (good) { card.classList.add('mic-success'); showStickerOverlay(card, false); setTimeout(() => card.classList.remove('mic-success'), 1000); }
      else { card.classList.add('mic-fail'); setTimeout(() => card.classList.remove('mic-fail'), 500); }
    },
    onError(errCode) {
      card.classList.remove('mic-listening');
      card.classList.add('mic-fail');
      setTimeout(() => card.classList.remove('mic-fail'), 500);
      if (errCode === 'not-allowed' || errCode === 'service-not-allowed') alert('กรุณาอนุญาตให้ใช้ไมโครโฟนก่อนนะครับ');
    },
    onEnd() {}
  });
}

    card.addEventListener('click', handleCardClick);
    card.addEventListener('dblclick', handleCardDoubleClick);
    const micIcon = card.querySelector('.mic-icon');

      micIcon.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    }

    card.addEventListener('touchstart', (e) => {

      else {
        if (doubleTapTimer) clearTimeout(doubleTapTimer);
        doubleTapTimer = setTimeout(() => { doubleTapTimer = null; if (!isDoubleTap) handleCardClick(e); isDoubleTap = false; }, 350);
      }
    }, { passive: true });
  });

  loadPixabayImagesForCards();
}
function getWordData(card) {
  const idx = parseInt(card.dataset.index);
  return allWords[idx] || { en: card.dataset.en, th: card.dataset.th, pos: card.dataset.pos, grade: card.dataset.grade };
}
function handleCardClick(e) {
  const card = e.currentTarget;
  const data = getWordData(card);
  card.classList.add('speaking');
  setTimeout(() => card.classList.remove('speaking'), 800);
  speakEnglish(data.en);
}
function handleCardDoubleClick(e) {
  const card = e.currentTarget;
  const data = getWordData(card);
  if (doubleTapTimer) { clearTimeout(doubleTapTimer); doubleTapTimer = null; }
  isDoubleTap = true;
  showModal(data);
}

// ============================================================
//  MODAL
// ============================================================
function showModal(data) {
  currentModalWord = data;
  resetModalMicUI();
  modalEn.textContent = data.en;
  modalPos.textContent = data.pos || '';
  modalTh.textContent = data.th;

  const syns = getSynonyms(data.en);
  const synContainer = document.getElementById('modalSyn');
  if (syns.length) {
    synContainer.innerHTML = `<div class="modal-syn"><span class="label">≈ คำพ้อง:</span>${
      syns.map(s => `<span class="word" data-syn="${s}">${s}</span>`).join('')
    }</div>`;
    synContainer.querySelectorAll('.word').forEach(el => {
      el.addEventListener('click', (e) => { e.stopPropagation(); speakEnglish(el.dataset.syn); });
    });
  } else {
    synContainer.innerHTML = '';
  }

  const fallbackHTML = getImage(data.en, true);
  modalImageWrap.innerHTML = `${fallbackHTML}<img class="modal-pixabay-img" style="display:none;" alt="${data.en}">`;
  loadPixabayImageForModal(data.en, modalImageWrap);

  let html = '';
  if (data.sentenceEn) {
    html = `<div class="sentence-item"><div><div class="s-en">${data.sentenceEn}</div><div class="s-th">${data.sentenceTh || data.th}</div></div><button class="speak-sentence-btn" data-sentence="${data.sentenceEn}">🔊</button></div>`;
  } else {
    html = `<p style="color:#a78bfa;">ไม่มีตัวอย่างประโยค</p>`;
  }
  modalSentences.innerHTML = html;
  document.querySelectorAll('.speak-sentence-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); speakEnglish(btn.dataset.sentence); });
  });
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalCloseBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
modalSpeakBtn.addEventListener('click', () => { if (currentModalWord) speakEnglish(currentModalWord.en); });
const modalMicBtn = document.getElementById('modalMicBtn');
const modalMicFeedback = document.getElementById('modalMicFeedback');
function resetModalMicButton() {
  if (modalMicBtn) {
    modalMicBtn.classList.remove('listening');
    modalMicBtn.disabled = false;
    modalMicBtn.innerHTML = '<span>🎤</span> ลองพูดคำนี้';
  }
}
function resetModalMicUI() {
  if (modalMicFeedback) { modalMicFeedback.textContent = ''; modalMicFeedback.className = 'modal-mic-feedback'; }
  resetModalMicButton();
}
modalMicBtn.addEventListener('click', () => {
  if (!currentModalWord || isPracticing) return;
  if (!SpeechRecCtor) { modalMicFeedback.textContent = '😅 เบราว์เซอร์นี้ยังไม่รองรับ'; modalMicFeedback.className = 'modal-mic-feedback err'; return; }
  const word = currentModalWord.en;
  modalMicBtn.classList.add('listening');
  modalMicBtn.disabled = true;
  modalMicBtn.innerHTML = '<span>🎙️</span> กำลังฟัง...';
  modalMicFeedback.textContent = `พูดคำว่า "${word}" ได้เลยครับ`;
  modalMicFeedback.className = 'modal-mic-feedback';
  practicePronunciation(word, {
    onResult(good, heard) {
      if (good) {
        modalMicFeedback.textContent = '✅ เยี่ยมมาก! ออกเสียงถูกต้อง 🎉';
        modalMicFeedback.className = 'modal-mic-feedback good';
        showStickerOverlay(modalImageOuter, true);
      } else {
        modalMicFeedback.textContent = heard ? `🤔 เกือบแล้ว! ฉันได้ยินว่า "${heard}" ลองอีกครั้งนะ` : '🤔 ยังไม่ค่อยชัด ลองอีกครั้งนะ';
        modalMicFeedback.className = 'modal-mic-feedback bad';
      }
    },
    onError(errCode) {
      if (errCode === 'not-allowed' || errCode === 'service-not-allowed') modalMicFeedback.textContent = '🎙️ กรุณาอนุญาตให้ใช้ไมโครโฟนก่อนนะครับ';
      else if (errCode === 'no-speech') modalMicFeedback.textContent = '😶 ไม่ได้ยินเสียงเลย ลองพูดดังขึ้นอีกนิดนะ';
      else modalMicFeedback.textContent = '⚠️ เกิดข้อผิดพลาด ลองอีกครั้งนะครับ';
      modalMicFeedback.className = 'modal-mic-feedback err';
    },
    onEnd() { resetModalMicButton(); }
  });
});

// ============================================================
//  FILTER CONTROLS
// ============================================================
function populateGradeSelect() {
  const grades = ['ทั้งหมด'];
  const gradeSet = new Set();
  for (const w of allWords) {
    if (w.grade && !gradeSet.has(w.grade)) { gradeSet.add(w.grade); grades.push(w.grade); }
  }
  grades.sort((a, b) => {
    if (a === 'ทั้งหมด') return -1;
    if (b === 'ทั้งหมด') return 1;
    if (a === 'พิเศษ') return 1;
    if (b === 'พิเศษ') return -1;
    return parseInt(a.replace('ป.', '')) - parseInt(b.replace('ป.', ''));
  });
  gradeSelect.innerHTML = '';
  for (const g of grades) {
    const opt = document.createElement('option');
    opt.value = g;
    let label = g;
    if (g === 'ทั้งหมด') label = '🎃 ทั้งหมด';
    else if (g === 'พิเศษ') label = '🕸️ พิเศษ';
    else label = `📖 ${g}`;
    opt.textContent = label;
    gradeSelect.appendChild(opt);
  }
  gradeSelect.value = currentGrade;
  gradeTabs.innerHTML = '';
  for (const g of grades) {
    const btn = document.createElement('button');
    let label = g;
    if (g === 'ทั้งหมด') label = '🎃 ทั้งหมด';
    else if (g === 'พิเศษ') label = '🕸️ พิเศษ';
    else label = `ป.${g.replace('ป.', '')}`;
    btn.textContent = label;
    btn.dataset.grade = g;
    if (g === currentGrade) btn.classList.add('active');
    btn.addEventListener('click', () => {
      currentGrade = g;
      gradeSelect.value = g;
      document.querySelectorAll('.grade-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    gradeTabs.appendChild(btn);
  }
  const gameBtn = document.createElement('a');
  gameBtn.className = 'game-btn';
  gameBtn.href = 'https://tum-service.github.io/1111/quiz.html';
  gameBtn.target = '_blank';
  gameBtn.rel = 'noopener noreferrer';
  gameBtn.innerHTML = '<span class="game-pulse">🎮</span> เล่นเกม';
  gameBtn.title = 'ไปเล่นเกมทายคำศัพท์';
  gradeTabs.appendChild(gameBtn);
}
gradeSelect.addEventListener('change', (e) => {
  currentGrade = e.target.value;
  document.querySelectorAll('.grade-tabs button').forEach(b => b.classList.toggle('active', b.dataset.grade === currentGrade));
  render();
});
searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; render(); });

// ============================================================
//  BATS + FLOATERS
// ============================================================
const BAT_SVG = `<svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg"><path class="bat-wing" d="M30 12 Q18 2 8 6 Q14 12 6 18 Q16 20 22 16 Q26 20 30 20 Q34 20 38 16 Q44 20 54 18 Q46 12 52 6 Q42 2 30 12 Z" fill="#1a0b2e" stroke="#a855f7" stroke-width="0.6" opacity="0.9"/><circle cx="27" cy="12" r="1" fill="#f97316"/><circle cx="33" cy="12" r="1" fill="#f97316"/></svg>`;
function initBats() {
  const container = document.getElementById('bats');
  if (!container) return;
  let html = '';
  for (let i = 0; i < 6; i++) {
    const top = 5 + Math.random() * 45;
    const right = Math.random() * 70;
    const duration = 16 + Math.random() * 16;
    const delay = Math.random() * 20;
    const scale = 0.6 + Math.random() * 0.8;
    html += `<span class="bat" style="top:${top}%;right:${right}%;animation-duration:${duration}s;animation-delay:-${delay}s;transform:scale(${scale});">${BAT_SVG}</span>`;
  }
  container.innerHTML = html;
}
function initBgFloaters() {
  const container = document.getElementById('bgFloaters');
  if (!container) return;
  const emojis = ['🎃','👻','🦇','🕷️','🕸️','💀','🌙','⭐','🪦','🧙‍♀️'];
  let html = '';
  for (let i = 0; i < 16; i++) {
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const left = Math.random() * 100;
    const duration = 14 + Math.random() * 16;
    const delay = Math.random() * 22;
    const size = 16 + Math.random() * 20;
    html += `<span style="left:${left}%; font-size:${size}px; animation-duration:${duration}s; animation-delay:-${delay}s;">${emoji}</span>`;
  }
  container.innerHTML = html;
}

// ============================================================
//  FULLSCREEN
// ============================================================
const fsToggle = document.getElementById('fsToggle');
let fsUserOptOut = false;
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function requestFS() {
  const el = document.documentElement;
  try{
    if (el.requestFullscreen)       return el.requestFullscreen();
    if (el.webkitRequestFullscreen) return Promise.resolve(el.webkitRequestFullscreen());
    if (el.msRequestFullscreen)     return Promise.resolve(el.msRequestFullscreen());
  }catch(e){}
  return Promise.resolve();
}
function exitFS() {
  try{
    if (document.exitFullscreen)        return document.exitFullscreen();
    if (document.webkitExitFullscreen)  return Promise.resolve(document.webkitExitFullscreen());
    if (document.msExitFullscreen)      return Promise.resolve(document.msExitFullscreen());
  }catch(e){}
  return Promise.resolve();
}
function updateFsIcon() {
  if (isFullscreen()) fsToggle.classList.add('is-fullscreen');
  else fsToggle.classList.remove('is-fullscreen');
}
function tryAutoFullscreen() {
  if (fsUserOptOut || isFullscreen()) return;
  requestFS().catch(()=>{});
}
fsToggle.addEventListener('click', () => {
  if (isFullscreen()) {
    fsUserOptOut = true;
    exitFS().catch(()=>{});
  } else {
    fsUserOptOut = false;
    requestFS().catch(()=>{});
  }
});
['fullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(evt => {
  document.addEventListener(evt, updateFsIcon);
});
updateFsIcon();
tryAutoFullscreen();
['click','touchstart','keydown','pointerdown'].forEach(ev => {
  document.addEventListener(ev, tryAutoFullscreen, {passive:true});
});

// ============================================================
//  INIT
// ============================================================
function init() {
  initBats();
  initBgFloaters();
  allWords = parseVocabData(VOCAB_DATA);
  const seen = new Set();
  const unique = [];
  for (const w of allWords) {
    const key = w.en + '|' + w.th;
    if (!seen.has(key)) { seen.add(key); unique.push(w); }
  }
  allWords = unique;
  populateGradeSelect();
  render();
  console.log(`✅ โหลดคำศัพท์ ${allWords.length} คำ · 🎃 Happy Halloween!`);
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    setTimeout(loadBestEnglishVoice, 500);
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
